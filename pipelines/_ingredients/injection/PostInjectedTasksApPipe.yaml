description: Auxiliar Pipeline file with synthetic/fake sources tasks.
# This pipeline is used by source injection pipeline generation tools.
# This is not a functional pipeline on its own, and is not intended to be run
# directly.

imports:
  - location: resource://lsst.analysis.tools/resources/pipelines/apDetectorVisitFakesCore.yaml

parameters:
  apdb_config: apdb_conf.py

tasks:
  injectedMatchDiaSrc:
    class: lsst.pipe.tasks.matchDiffimSourceInjected.MatchInjectedToDiaSourceTask
    config:
      connections.matchDiaSources: fakes_goodSeeingDiff_matchDiaSrc
      connections.injectionCat: VisitDetectorFakeSourceCat
      connections.diffIm: difference_image
      connections.diaSources: dia_source_unfiltered
      matchDistanceArcseconds: 0.5
      trimBuffer: 50
  injectedMatchAssocDiaSrc:
    class: lsst.pipe.tasks.matchDiffimSourceInjected.MatchInjectedToAssocDiaSourceTask
    config:
      connections.assocDiaSources: dia_source_apdb
      connections.matchDiaSources: fakes_goodSeeingDiff_matchDiaSrc
      connections.matchAssocDiaSources: fakes_goodSeeingDiff_matchAssocDiaSrc
  consolidateMatchDiaSrc:
    class: lsst.pipe.tasks.postprocess.ConsolidateSourceTableTask
    config:
      connections.inputCatalogs: fakes_goodSeeingDiff_matchDiaSrc
      connections.outputCatalog: fakes_goodSeeingDiff_matchDiaSourceTable
  consolidateMatchAssocDiaSrc:
    class: lsst.pipe.tasks.postprocess.ConsolidateSourceTableTask
    config:
      connections.inputCatalogs: fakes_goodSeeingDiff_matchAssocDiaSrc
      connections.outputCatalog: fakes_goodSeeingDiff_matchAssocDiaSourceTable
