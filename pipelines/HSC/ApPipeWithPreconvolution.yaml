description: End to end AP pipeline with preconvolution specialized for HSC
# (1) Execute `apdb-cli create-sql`, e.g.,
#     apdb-cli create-sql "sqlite:////project/user/association.db" apdb_config.yaml
#     apdb-cli metadata set apdb_config.yaml instrument HSC
# (2) Run this pipeline, setting the apdb_config parameter to point to the new file

instrument: lsst.obs.subaru.HyperSuprimeCam
imports:
  - location: resource://lsst.ap.pipe/resources/pipelines/_ingredients/ApPipeWithPreconvolution.yaml
tasks:
  # Override the class for `isr`, which is set to `IsrTaskLSST` in the base
  # pipeline in `_ingredients`
  isr:
    class: lsst.ip.isr.IsrTask
    config:
      connections.outputExposure: post_isr_image
      doBrighterFatter: False
