description: LSSTCam AP Pipeline with synthetic/fake sources. Templates are inputs.
# Remember:
# (0) Ensure median calibration products and template coadds exist for the data being processed
# (1) Execute `apdb-cli create-sql`, e.g.,
#     apdb-cli create-sql "sqlite:////project/user/association.db" apdb_config.py
# (2) Run this pipeline, setting the apdb_config parameter to point to the new file

instrument: lsst.obs.lsst.LsstCam
imports:
  # Warning: In the import below, _ingredients/ApPipeWithFakes.yaml is a file
  #  that is generated when running scons compilation of the ap_pipe package.
  #  Do not edit this file as changes will be overwritten during the next build.
  - location: $AP_PIPE_DIR/pipelines/_ingredients/ApPipeWithFakes.yaml

parameters:
  coaddName: goodSeeing
  # APDB config file must be user-specified
  apdb_config:

tasks:
  # Swap in the LSST-specific ISR task. Overriding the task in place (rather than
  # excluding `isr` from the import and re-adding it) keeps the `isr` label intact,
  # so all subsets are inherited from _ingredients/ApPipeWithFakes.yaml and stay in
  # sync with _ingredients/ApPipe.yaml automatically.
  isr:
    class: lsst.ip.isr.IsrTaskLSST
    config:
      connections.outputExposure: post_isr_image
      # Some instruments have this already in obs_lsst.
      # Here we turn it off for AP generally.
      doBrighterFatter: False
      # Turn off the amp offset calculation.
      # It is only used to compute metrics, and takes several seconds.
      doAmpOffset: False
