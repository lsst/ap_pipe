description: The LSSTCam AP template building pipeline with preliminary_visit_images as inputs.
# Important Note: Use QuickTemplate BPS clustering file when running with BPS.

instrument: lsst.obs.lsst.LsstCam

imports:
- location: resource://lsst.ap.pipe/resources/pipelines/_ingredients/QuickTemplate.yaml
  exclude:
  - isr
  - calibrateImage
  labeledSubsetModifyMode: EDIT

parameters:
  image_type: future
  use_cell_coadds: true
